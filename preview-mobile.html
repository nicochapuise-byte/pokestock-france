<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aperçu mobile — PokéStock France</title><style>body{margin:0;background:#e9ede5;font:13px/1.5 system-ui,sans-serif;color:#293626}header{height:58px;display:flex;align-items:center;justify-content:center;gap:9px}header a{color:inherit;margin-right:20px;text-decoration:none}button{padding:7px 12px;border:1px solid #ccd5c5;border-radius:5px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#293c26;color:white}main{display:flex;justify-content:center;padding:5px 10px 20px}iframe{width:390px;height:812px;max-width:100%;border:1px solid #cbd4c4;background:#fff;box-shadow:0 6px 30px #22351c17;border-radius:8px}</style></head><body><header><a href="index.html">PokéStock · aperçu mobile</a><button type="button" data-width="360" aria-pressed="false">360 px</button><button type="button" data-width="390" aria-pressed="true">390 px</button><button type="button" data-width="768" aria-pressed="false">Tablette</button></header><main><iframe title="Site PokéStock en format mobile" src="index.html"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script></body></html>
