name: Backend - stage production account erasure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/deploy-erasure-production.mjs', '.github/workflows/backend-erasure-production.yml']
permissions:
  contents: read
concurrency:
  group: backend-erasure-production
  cancel-in-progress: false
jobs:
  stage-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: node --test backend/deploy-erasure-production.test.mjs
      - name: Stage production with automatic erasure disabled
        env:
          NEON_ERASURE_API_KEY: ${{ secrets.NEON_ERASURE_API_KEY }}
        run: node backend/deploy-erasure-production.mjs
