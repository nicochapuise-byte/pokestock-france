name: Mobile Android - development build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '*.html', '*.js', '*.css', '*.svg', 'assets/**', 'backend/account-deletion.mjs', 'backend/account-deletion.test.mjs', 'backend/account-erasure.mjs', 'backend/account-erasure.test.mjs', 'backend/account-access.test.mjs', 'backend/erasure-storage.mjs', 'backend/erasure-storage.test.mjs', 'backend/index.mjs', 'backend/account-operations.mjs', 'backend/account-operations.test.mjs', 'backend/account-erasure-service.mjs', 'backend/account-erasure-service.test.mjs', 'backend/erasure-identity.mjs', 'backend/erasure-session.mjs', 'backend/erasure-session.test.mjs', 'backend/erasure-identity.test.mjs', '.github/workflows/mobile-android.yml']
permissions:
  contents: read
concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx cap sync android
      - name: Restore and verify permanent signing key
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: node scripts/restore-signing.mjs
      - name: Compile development APK (not a Play Store release)
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - name: Verify APK signing certificate
        run: node scripts/verify-apk-signing.mjs
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pokestock-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: pokestock-android-development
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish-beta:
    needs: android-debug
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pokestock-android-development
          path: apk
      - name: Publish versioned APK for beta testers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./mobile/package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="android-beta-v$VERSION"
          APK="PokeStock-France-$VERSION-test.apk"
          cp apk/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "This beta version is already published. Bump the app version for a new release."
            exit 0
          fi
          cat > beta-release-notes.md <<'NOTES'
          Version Android de test de PokéStock France.
          
          Téléchargez le fichier APK ci-dessous et ouvrez-le sur Android.
          Pour mettre à jour une version de test existante, installez cet APK sans désinstaller l'application.
          
          Utilisez une adresse e-mail et un mot de passe pour créer votre compte testeur. Google reste limité aux comptes de test autorisés.
          
          Cette bêta utilise un environnement de développement distinct de la production. Les signalements de test ne constituent pas des disponibilités garanties.
          NOTES
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --prerelease --title "PokéStock France $VERSION — bêta Android" --notes-file beta-release-notes.md
