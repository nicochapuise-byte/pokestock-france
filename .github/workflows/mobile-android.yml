name: Mobile Android - development build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '*.html', '*.js', '*.css', '*.svg', 'assets/**', 'backend/account-deletion.mjs', 'backend/account-deletion.test.mjs', '.github/workflows/mobile-android.yml']
permissions:
  contents: read
concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx cap sync android
      - name: Compile development APK (not a Play Store release)
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: pokestock-android-development
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
